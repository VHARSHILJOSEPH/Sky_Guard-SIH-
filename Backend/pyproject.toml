[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skyguard-ml"
version = "0.1.0"
description = "Weather sensor anomaly detection engine"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "pydantic>=2.0",
    "requests>=2.28",
    "supabase>=2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
