<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="28" y1="28" x2="36" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded base badge with subtle cyan rim -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#2dd4bf" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Protective Atmospheric Shield Outline -->
  <path d="M32 12 L48 18 C48 31 41 42 32 50 C23 42 16 31 16 18 Z"
        fill="#041d28"
        fill-opacity="0.8"
        stroke="url(#shieldGrad)"
        stroke-width="2.75"
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Radar Atmospheric Sweeps -->
  <path d="M24 28 A 10 10 0 0 1 40 28" fill="none" stroke="#2dd4bf" stroke-width="2.2" stroke-linecap="round" opacity="0.9" />
  <path d="M27.5 33 A 5.5 5.5 0 0 1 36.5 33" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

  <!-- Central Weather Sensor Node -->
  <circle cx="32" cy="38" r="3.2" fill="url(#pulseGrad)" />
  <circle cx="32" cy="38" r="5.5" fill="none" stroke="#5eead4" stroke-width="1.2" stroke-dasharray="2 1.5" opacity="0.85" />
</svg>
